name: 3.1.2 foldable candidate

# Cloud-only candidate build: the local machine has no Flutter/JDK toolchain,
# so the APK is produced on a GitHub runner and attached to a Release so it can
# be downloaded without any authenticated Actions artifact API.

on:
  push:
    branches:
      - candidate-312-foldable
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-312-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android arm64-v8a release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Show candidate version
        run: grep -n '^version:' pubspec.yaml

      # The first 3.1.3 candidate run produced a valid, signed APK but still
      # ended in a red "failure": AGP launches sdkmanager while configuring when
      # the NDK is missing, and `org.gradle.configuration-cache.problems=fail`
      # cannot store that. The APK is fine either way, but a green run is easier
      # to trust, so the cache is disabled for the candidate build.
      - name: Disable Gradle configuration cache
        run: |
          sed -i 's/^org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' android/gradle.properties
          grep -n 'configuration-cache' android/gradle.properties

      - name: Resolve packages
        run: flutter pub get

      - name: Generate AppConfig
        run: dart run enven --env-files .env,.env.prod --class-name AppConfig

      # Diagnostic only: a lint finding must not stop the candidate build, but
      # its log is published with the APK so compile problems stay visible.
      - name: Analyze (diagnostic)
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          echo "analyze exit code: $?"
          tail -n 80 analyze.log

      - name: Build Android arm64-v8a release APK
        env:
          PURELIVE_CANDIDATE: 'true'
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi 2>&1 | tee build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          for apk in build/app/outputs/flutter-apk/*.apk; do
            [ -e "$apk" ] || continue
            cp -f "$apk" "out/PureLive-3.1.2-4100-foldable-coexist-$(basename "$apk")"
          done
          cp -f analyze.log out/analyze.log 2>/dev/null || true
          cp -f build.log out/build.log 2>/dev/null || true
          if ls out/*.apk >/dev/null 2>&1; then
            (cd out && sha256sum ./*.apk > SHA256SUMS.txt)
          fi
          ls -lh out

      - name: Keep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purelive-312-foldable
          path: out/*
          if-no-files-found: warn
          retention-days: 14

      # A Release asset is downloadable without a token, which is how the
      # candidate gets back to a machine that has no Actions API access.
      - name: Publish run outputs
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: candidate-312-foldable-${{ github.run_number }}
          name: 3.1.2 foldable candidate ${{ github.run_number }}
          body: |
            Automated candidate build.

            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Base: Pure Live v3.1.2 (3.1.2+4100)
            - Package: com.mystyle.purelive.candidate (coexist, debug signing)
            - Label: 纯粹直播 测试
            - Contains the unfolded inner-screen split port
          files: out/*
          fail_on_unmatched_files: false
          make_latest: false
